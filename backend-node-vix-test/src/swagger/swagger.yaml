    # ==================== VM SCHEMAS ====================
    VMResponse:
      type: object
      properties:
        idVM:
          type: integer
          description: ID da VM
          example: 1
        vmName:
          type: string
          nullable: true
          description: Nome da VM
          example: Servidor Web Production
        vCPU:
          type: integer
          description: Número de vCPUs
          example: 4
        ram:
          type: integer
          description: Memória RAM em MB
          example: 8192
        disk:
          type: integer
          description: Disco em GB
          example: 100
        os:
          type: string
          nullable: true
          description: Sistema operacional
          example: Ubuntu 22.04 LTS
        location:
          type: string
          nullable: true
          enum: [BR_SAO_PAULO, US_EAST_N_VIRGINIA, US_WEST_N_CALIFORNIA, EU_WEST_IRELAND]
          description: Localização do data center
          example: BR_SAO_PAULO
        status:
          type: string
          nullable: true
          enum: [RUNNING, STOPPED, PAUSED]
          description: Status atual da VM
          example: RUNNING
        hasBackup:
          type: boolean
          nullable: true
          description: Backup habilitado?
          example: true
        pass:
          type: string
          nullable: true
          description: Senha da VM (criptografada)
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Data de criação
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Data da última atualização
        brandMaster:
          $ref: '#/components/schemas/BrandMasterResponse'
          nullable: true

    CreateVMRequest:
      type: object
      required:
        - vmName
        - vCPU
        - ram
        - disk
        - location
      properties:
        vmName:
          type: string
          description: Nome da VM
          example: Servidor Web Production
        vCPU:
          type: integer
          minimum: 1
          maximum: 64
          description: Número de vCPUs
          example: 4
        ram:
          type: integer
          minimum: 512
          description: Memória RAM em MB
          example: 8192
        disk:
          type: integer
          minimum: 10
          description: Disco em GB
          example: 100
        os:
          type: string
          description: Sistema operacional
          example: Ubuntu 22.04 LTS
        location:
          type: string
          enum: [BR_SAO_PAULO, US_EAST_N_VIRGINIA, US_WEST_N_CALIFORNIA, EU_WEST_IRELAND]
          description: Localização do data center
          example: BR_SAO_PAULO
        hasBackup:
          type: boolean
          default: false
          description: Habilitar backup?
        pass:
          type: string
          description: Senha de acesso à VM
          minLength: 8
          example: SenhaSegura123!
        brandMasterId:
          type: integer
          description: ID da organização associada
          example: 1

    UpdateVMRequest:
      type: object
      properties:
        vmName:
          type: string
          description: Nome da VM
        vCPU:
          type: integer
          minimum: 1
          maximum: 64
          description: Número de vCPUs
        ram:
          type: integer
          minimum: 512
          description: Memória RAM em MB
        disk:
          type: integer
          minimum: 10
          description: Disco em GB
        os:
          type: string
          description: Sistema operacional
        location:
          type: string
          enum: [BR_SAO_PAULO, US_EAST_N_VIRGINIA, US_WEST_N_CALIFORNIA, EU_WEST_IRELAND]
          description: Localização do data center
        status:
          type: string
          enum: [RUNNING, STOPPED, PAUSED]
          description: |
            Status da VM:
            - **RUNNING** - Iniciar a VM
            - **STOPPED** - Parar a VM
            - **PAUSED** - Pausar a VM
        hasBackup:
          type: boolean
          description: Habilitar/desabilitar backup
        pass:
          type: string
          description: Nova senha de acesso
          minLength: 8

